<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101725" />
    <title>Media Downloader</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">↓</div>
        <div>
          <p class="eyebrow">MEDIA DOWNLOADER</p>
          <h1>Всё нужное —<br />по одной ссылке</h1>
        </div>
      </header>

      <section class="card composer">
        <label for="media-url">Ссылка на публикацию</label>
        <div class="input-wrap">
          <span aria-hidden="true">↗</span>
          <input id="media-url" type="url" inputmode="url" autocomplete="url"
            placeholder="Вставьте ссылку сюда" maxlength="2000" />
          <button id="paste-button" class="paste" type="button" aria-label="Вставить ссылку">Вставить</button>
        </div>
        <p id="service-label" class="service-label">Сервис определится автоматически</p>
        <button id="download-button" class="primary" type="button" disabled>
          <span>Подготовить файл</span><span aria-hidden="true">→</span>
        </button>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
      </section>

      <section class="supported">
        <p class="section-title">ПОДДЕРЖИВАЕМЫЕ СЕРВИСЫ</p>
        <div class="service-grid">
          <span>◎ Instagram</span><span>▶ YouTube</span>
          <span>◈ Pinterest</span><span>f Facebook</span>
        </div>
      </section>

      <footer>После отправки бот пришлёт файл в этот чат</footer>
    </main>
  </body>
</html>
